<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            
            gap: 10px;

            border: 2px solid #d2d2d2;
            padding: 20px;
            border-radius: 10px;
        }
        .container a {
            font-size: 2rem;
            text-decoration: none;
            color: #2c2b2b;
        }

        .container a:nth-of-type(1) {
            padding: 10px;
            border-bottom: 1px solid #d2d2d2;
        }
        
        .container a:nth-of-type(2) {
            color: rgb(0, 60, 255);
        }

    </style>
</head>
<body>
    <section class="container">
        <a href="doc.txt" target="_self">
            Visualizar aquivo
        </a>
        <a href="doc.txt" download>
            Baixar aquivo
        </a>
    </section>
</body>
</html>
